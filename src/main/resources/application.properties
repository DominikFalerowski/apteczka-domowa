spring.application.name=apteczka-domowa

# Baza: aplikacja łączy się jako apteczka_app (DML), Flyway jako apteczka_migrator (DDL).
# Wartości domyślne pasują do compose.yaml i db/init/01-roles.sql (tylko dev); nadpisz zmiennymi środowiskowymi.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/apteczka}
spring.datasource.username=${DB_APP_USER:apteczka_app}
spring.datasource.password=${DB_APP_PASSWORD:apteczka_app_dev}

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5433/apteczka}
spring.flyway.user=${DB_MIGRATOR_USER:apteczka_migrator}
spring.flyway.password=${DB_MIGRATOR_PASSWORD:apteczka_migrator_dev}
spring.flyway.default-schema=apteczka

spring.jpa.properties.hibernate.default_schema=apteczka
